<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account - CareerConnect AI</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          <rect x="2" y="6" width="20" height="14" rx="2"/>
        </svg>
        CareerConnect <span class="logo-badge">AI</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="jobs.html" class="nav-link">Browse Jobs</a></li>
        <li><a href="user-dashboard.html" class="nav-link">Candidate Portal</a></li>
        <li><a href="recruiter-dashboard.html" class="nav-link">Recruiter Portal</a></li>
        <li><a href="admin-dashboard.html" class="nav-link">Admin Center</a></li>
      </ul>

      <div class="nav-actions">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <a href="login.html" class="btn btn-outline">Log In</a>
        <a href="register.html" class="btn btn-primary">Register</a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 540px; margin: 60px auto;">
    <div class="card" style="padding: 36px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 26px;">Create your Account</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Join the CareerConnect AI placement network</p>
      </div>

      <!-- Role Switcher -->
      <div style="display: flex; gap: 8px; margin-bottom: 28px; background: var(--bg-subtle); padding: 4px; border-radius: var(--radius-md);">
        <button type="button" id="tab-seeker" onclick="switchTab('seeker')" class="btn btn-primary btn-sm" style="flex: 1;">Candidate / Job Seeker</button>
        <button type="button" id="tab-recruiter" onclick="switchTab('recruiter')" class="btn btn-outline btn-sm" style="flex: 1;">Recruiter / Employer</button>
      </div>

      <!-- Candidate Form -->
      <form id="form-seeker" onsubmit="event.preventDefault(); submitRegister('user-dashboard.html');">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Alex Johnson" required>
        </div>
        <div class="form-group">
          <label class="form-label">College / Personal Email</label>
          <input type="email" class="form-control" placeholder="alex@college.edu" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Create password" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" placeholder="9876543210">
        </div>
        <div class="form-group">
          <label class="form-label">Bio / Career Goal</label>
          <textarea class="form-control" rows="3" placeholder="Final year CS student passionate about Java & React..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Create Candidate Account</button>
      </form>

      <!-- Recruiter Form -->
      <form id="form-recruiter" onsubmit="event.preventDefault(); submitRegister('recruiter-dashboard.html');" style="display: none;">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Jane Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label">Work Email</label>
          <input type="email" class="form-control" placeholder="jane@company.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Create password" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" placeholder="9876543210">
        </div>
        <div class="form-group">
          <label class="form-label">Company Name</label>
          <input type="text" class="form-control" placeholder="TechCorp Innovations" required>
        </div>
        <div class="form-group">
          <label class="form-label">Designation / Role</label>
          <input type="text" class="form-control" placeholder="Lead Technical Recruiter" required>
        </div>
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">Industry</label>
            <input type="text" class="form-control" placeholder="IT & Software">
          </div>
          <div class="form-group">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" placeholder="Bangalore, India">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Create Recruiter Account</button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="font-weight: 600;">Sign In</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 CareerConnect AI. Account Registration.</p>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    function switchTab(tab) {
      if (tab === 'seeker') {
        document.getElementById('form-seeker').style.display = 'block';
        document.getElementById('form-recruiter').style.display = 'none';
        document.getElementById('tab-seeker').className = 'btn btn-primary btn-sm';
        document.getElementById('tab-recruiter').className = 'btn btn-outline btn-sm';
      } else {
        document.getElementById('form-seeker').style.display = 'none';
        document.getElementById('form-recruiter').style.display = 'block';
        document.getElementById('tab-seeker').className = 'btn btn-outline btn-sm';
        document.getElementById('tab-recruiter').className = 'btn btn-primary btn-sm';
      }
    }

    function submitRegister(targetPage) {
      showToast('Registration successful! Redirecting to portal...', 'success');
      setTimeout(() => {
        window.location.href = targetPage;
      }, 800);
    }
  </script>
</body>
</html>
