<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - CareerConnect AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          <rect x="2" y="6" width="20" height="14" rx="2"/>
        </svg>
        CareerConnect <span class="logo-badge">AI</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="jobs.html" class="nav-link">Browse Jobs</a></li>
        <li><a href="user-dashboard.html" class="nav-link">Candidate Portal</a></li>
        <li><a href="recruiter-dashboard.html" class="nav-link">Recruiter Portal</a></li>
        <li><a href="admin-dashboard.html" class="nav-link">Admin Center</a></li>
      </ul>

      <div class="nav-actions">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <a href="login.html" class="btn btn-outline">Log In</a>
        <a href="register.html" class="btn btn-primary">Register</a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 440px; margin: 60px auto;">
    <div class="card" style="padding: 36px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 24px;">Reset Password</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Enter registered email to reset account access</p>
      </div>

      <form onsubmit="event.preventDefault(); submitReset();">
        <div class="form-group">
          <label class="form-label">Registered Email</label>
          <input type="email" class="form-control" placeholder="alex.student@college.edu" required>
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" class="form-control" placeholder="Enter new password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Reset Password</button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 14px;">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 CareerConnect AI. Password Recovery.</p>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    function submitReset() {
      showToast('Password reset successful! You can now log in.', 'success');
      setTimeout(() => {
        window.location.href = 'login.html?msg=password_reset';
      }, 1000);
    }
  </script>
</body>
</html>
